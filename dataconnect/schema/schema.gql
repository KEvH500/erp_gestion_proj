# Schéma GraphQL pour Firebase Data Connect (SQL Connect)
# Représente la structure des données répliquées de l'application Weekora

type Activity @table(key: ["id"]) {
  id: String!
  title: String!
  description: String
  startDate: Date!
  startHour: Int!
  startMinute: Int!
  endHour: Int!
  endMinute: Int!
  category: String!
  isCompleted: Boolean!
  isLocked: Boolean!
  lastUpdated: Timestamp! @default(expr: "request.time")
}

type UnplannedTask @table(key: ["id"]) {
  id: String!
  title: String!
  description: String
  priority: String!
  isCompleted: Boolean!
  date: Date!
  estimatedMinutes: Int
  createdAt: Timestamp
  lastUpdated: Timestamp! @default(expr: "request.time")
}
