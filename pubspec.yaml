name: erp_gestion_proj
description: "Application mobile de gestion d'emploi du temps hebdomadaire (Lundi à Dimanche) sous architecture MVC avec GetX."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  reactive_forms: ^17.0.1
  flutter_local_notifications: ^17.2.2
  intl: ^0.20.2
  uuid: ^4.4.2
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  workmanager: ^0.5.2
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  hive_generator: ^2.0.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
